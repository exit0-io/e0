<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How did this merge conflict happen?</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --line: #d0d7de; --panel: #f6f8fa;
    --main: #0969da; --feature: #8250df; --edit: #bf8700; --ok: #1a7f37; --bad: #cf222e; --merge: #6e7781;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #3d444d; --panel: #161b22;
      --main: #4493f8; --feature: #ab7df8; --edit: #d29922; --ok: #3fb950; --bad: #f85149; --merge: #9198a1;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 900px; margin: 0 auto; padding: 24px 20px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 20px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.95em; background: var(--panel); padding: 1px 5px; border-radius: 4px; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 720px) { .grid { grid-template-columns: 3fr 2fr; } }
  .panel { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; background: var(--panel); }
  .panel h2 { font-size: 1rem; margin: 0 0 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  svg { width: 100%; height: auto; display: block; }
  .commit { stroke-width: 3; fill: var(--bg); }
  .lbl { font: 13px ui-monospace, monospace; fill: var(--fg); }
  .lbl.muted { fill: var(--muted); }
  .head { font: 600 12px system-ui, sans-serif; fill: var(--bg); }
  .step { font-weight: 600; margin: 0 0 8px; }
  .story { margin: 0 0 12px; font-size: .95rem; }
  button { font: inherit; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; margin: 4px 6px 4px 0; }
  button.primary { background: var(--main); border-color: var(--main); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  .out { margin-top: 12px; padding: 12px; border-radius: 6px; border-left: 4px solid var(--line); background: var(--bg); white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: .9rem; }
  .out.ok { border-color: var(--ok); }
  .out.bad { border-color: var(--bad); }
  .file { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-top: 10px; font-family: ui-monospace, monospace; font-size: .9rem; white-space: pre; overflow-x: auto; background: var(--bg); }
  .file .title { color: var(--muted); font-family: system-ui, sans-serif; font-size: .8rem; margin-bottom: 4px; }
  .ours { color: var(--feature); }
  .theirs { color: var(--main); }
  .marker { color: var(--bad); font-weight: 600; }
  fieldset { border: 0; padding: 0; margin: 10px 0 0; }
  legend { font-weight: 600; margin-bottom: 6px; }
  label { display: block; margin: 4px 0; cursor: pointer; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>How did this <code>merge conflict</code> happen?</h1>
  <p class="lead">You are on <code id="lead-branch"></code> and merged <code id="lead-other"></code> into it. Git stopped on <code id="lead-file"></code>. Step through what happened.</p>

  <div class="grid">
    <section class="panel">
      <h2>Your repository</h2>
      <svg id="graph" viewBox="0 0 520 220" role="img" aria-label="Two branches that changed the same file"></svg>
      <div id="file" class="file"></div>
    </section>

    <section class="panel">
      <h2>Step by step</h2>
      <p id="step" class="step"></p>
      <p id="story" class="story"></p>
      <fieldset id="resolve" class="hidden">
        <legend>What should the final line be?</legend>
        <label><input type="radio" name="pick" value="ours" checked> Keep your version (<span class="b"></span>)</label>
        <label><input type="radio" name="pick" value="theirs"> Take the incoming version (<span class="o"></span>)</label>
        <label><input type="radio" name="pick" value="both"> Keep both lines</label>
      </fieldset>
      <div>
        <button id="back">Back</button>
        <button id="next" class="primary">Next</button>
        <button id="reset">Start over</button>
      </div>
      <div id="out" class="out hidden"></div>
    </section>
  </div>
</main>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const branch = params.get("branch") || "my-feature-branch";
  const other = params.get("other") || "main";
  const file = params.get("file") || "app.py";

  const BASE = ["def greet(name):", '    return "Hello, " + name'];
  const THEIRS = '    return f"Hello, {name}!"';
  const OURS = '    return "Hi, " + name';

  const $ = (id) => document.getElementById(id);
  document.querySelectorAll(".b").forEach((n) => (n.textContent = branch));
  document.querySelectorAll(".o").forEach((n) => (n.textContent = other));
  $("lead-branch").textContent = branch;
  $("lead-other").textContent = other;
  $("lead-file").textContent = file;

  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const pick = () => document.querySelector("input[name=pick]:checked").value;

  function circle(x, y, color, label, below) {
    return `<circle class="commit" cx="${x}" cy="${y}" r="9" stroke="${color}"></circle>` +
      `<text class="lbl muted" x="${x}" y="${below ? y + 26 : y - 16}" text-anchor="middle">${esc(label)}</text>`;
  }
  function tag(x, y, color, text) {
    const w = text.length * 7.5 + 14;
    return `<rect x="${x - w / 2}" y="${y - 11}" width="${w}" height="22" rx="11" fill="${color}"></rect>` +
      `<text class="head" x="${x}" y="${y + 4}" text-anchor="middle">${esc(text)}</text>`;
  }

  // Steps: 0 shared history, 1 other changes the file, 2 you change the same line,
  // 3 the merge stops, 4 you resolve, 5 add and commit.
  const STEPS = [
    {
      title: "1. One shared history",
      story: `Both branches start from the same commit. <code>${esc(file)}</code> is identical on <code>${esc(branch)}</code> and on <code>${esc(other)}</code>.`,
    },
    {
      title: `2. <code>${esc(other)}</code> changes the file`,
      story: `A commit lands on <code>${esc(other)}</code> (for example, a pull request was merged there) and changes line 2 of <code>${esc(file)}</code>.`,
    },
    {
      title: `3. You change the same line on <code>${esc(branch)}</code>`,
      story: `Working on your task, you commit a different version of the same line 2. Each branch is fine on its own. Git does not know yet that they disagree.`,
    },
    {
      title: `4. <code>git merge ${esc(other)}</code>`,
      story: `Git brings the two histories together. Every line that changed on only one side merges by itself. Line 2 changed on both sides, in different ways, so Git cannot choose. It stops and writes both versions into the file between markers. <code>HEAD</code> is your side, <code>${esc(other)}</code> is the incoming side.`,
    },
    {
      title: "5. You decide",
      story: `This is the only step Git leaves to a person. Pick what line 2 should be. In VS Code the Merge Editor does the same thing with buttons.`,
    },
    {
      title: `6. <code>git add ${esc(file)}</code> and <code>git commit</code>`,
      story: `The markers are gone, the file has one version. Adding and committing finishes the merge with a merge commit that has two parents.`,
    },
  ];

  // `step` in the URL opens the page at that step (0 to 5), for a link straight to the conflict.
  let step = Math.min(Math.max(parseInt(params.get("step") || "0", 10) || 0, 0), STEPS.length - 1);

  function draw() {
    const otherColor = "var(--main)", ownColor = "var(--feature)";
    let s = "";
    s += `<line x1="60" y1="110" x2="150" y2="110" stroke="var(--line)" stroke-width="3"></line>`;
    s += circle(60, 110, "var(--muted)", "A", true);
    s += circle(150, 110, "var(--muted)", "B", true);
    if (step >= 1) {
      s += `<path d="M150 110 C 190 110, 190 60, 240 60" fill="none" stroke="${otherColor}" stroke-width="3"></path>`;
      s += circle(240, 60, otherColor, "line 2 changed", false);
    }
    if (step >= 2) {
      s += `<path d="M150 110 C 190 110, 190 160, 240 160" fill="none" stroke="${ownColor}" stroke-width="3"></path>`;
      s += circle(240, 160, ownColor, "line 2 changed", true);
    }
    if (step >= 5) {
      s += `<path d="M240 60 C 300 60, 300 110, 360 110" fill="none" stroke="${otherColor}" stroke-width="3"></path>`;
      s += `<path d="M240 160 C 300 160, 300 110, 360 110" fill="none" stroke="${ownColor}" stroke-width="3"></path>`;
      s += circle(360, 110, "var(--merge)", "merge commit", true);
    } else if (step >= 3) {
      s += `<path d="M240 60 C 300 60, 300 110, 350 110" fill="none" stroke="${otherColor}" stroke-width="3" stroke-dasharray="6 6"></path>`;
      s += `<text class="lbl" x="372" y="114" fill="var(--bad)">stopped</text>`;
    }
    // Branch labels sit next to the commit each branch points at.
    const otherTag = step >= 1 ? [400, 60] : [150, 30];
    const ownTag = step >= 5 ? [470, 110] : step >= 2 ? [400, 160] : [150, 165];
    s += tag(otherTag[0], otherTag[1], otherColor, other);
    s += tag(ownTag[0], ownTag[1], ownColor, branch);
    s += `<text class="lbl" x="${ownTag[0]}" y="${ownTag[1] + 32}" text-anchor="middle">you are here</text>`;
    $("graph").innerHTML = s;

    let lines;
    if (step <= 1) lines = BASE.map(esc);
    else if (step === 2) lines = [esc(BASE[0]), `<span class="ours">${esc(OURS)}</span>`];
    else if (step === 3 || step === 4) lines = [
      esc(BASE[0]),
      `<span class="marker">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</span>`,
      `<span class="ours">${esc(OURS)}</span>`,
      `<span class="marker">=======</span>`,
      `<span class="theirs">${esc(THEIRS)}</span>`,
      `<span class="marker">&gt;&gt;&gt;&gt;&gt;&gt;&gt; ${esc(other)}</span>`,
    ];
    else {
      const chosen = pick();
      lines = [esc(BASE[0])];
      if (chosen === "ours" || chosen === "both") lines.push(`<span class="ours">${esc(OURS)}</span>`);
      if (chosen === "theirs" || chosen === "both") lines.push(`<span class="theirs">${esc(THEIRS)}</span>`);
    }
    const where = step === 1 ? `${file} on ${other}` : step >= 3 && step <= 4 ? `${file} in your folder` : `${file} on ${branch}`;
    $("file").innerHTML = `<div class="title">${esc(where)}</div>` + lines.join("\n");

    $("step").innerHTML = STEPS[step].title;
    $("story").innerHTML = STEPS[step].story;
    $("resolve").classList.toggle("hidden", step !== 4);

    const out = $("out");
    if (step === 3) {
      out.className = "out bad";
      out.textContent = `Auto-merging ${file}\nCONFLICT (content): Merge conflict in ${file}\nAutomatic merge failed; fix conflicts and then commit the result.`;
    } else if (step === 5) {
      out.className = "out ok";
      out.textContent = `[${branch} 7c1e2a9] Merge branch '${other}' into ${branch}`;
    } else {
      out.className = "out hidden";
    }

    $("back").disabled = step === 0;
    $("next").disabled = step === STEPS.length - 1;
  }

  $("next").addEventListener("click", () => { if (step < STEPS.length - 1) { step += 1; draw(); } });
  $("back").addEventListener("click", () => { if (step > 0) { step -= 1; draw(); } });
  $("reset").addEventListener("click", () => { step = 0; draw(); });
  document.querySelectorAll("input[name=pick]").forEach((r) => r.addEventListener("change", draw));
  draw();
})();
</script>
</body>
</html>
